name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/base44-local-images-9j55st]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Covers Pages "Deploy from a branch" mode (source: gh-pages).
      - name: Publish dist to gh-pages branch
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site to GitHub Pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      # Covers Pages "GitHub Actions" source mode; tolerated if the repo
      # is configured for branch deployment instead.
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
